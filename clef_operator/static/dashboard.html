<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clef Operator</title>
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10); --wash: rgba(11, 11, 11, 0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --q1: #86b6ef; --q2: #5598e7; --q3: #2a78d6; --q4: #1c5cab; --q5: #104281;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --critical-wash: rgba(208, 59, 59, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --q1: #184f95; --q2: #1c5cab; --q3: #2a78d6; --q4: #5598e7; --q5: #9ec5f4;
    --critical-wash: rgba(208, 59, 59, 0.22);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10); --wash: rgba(255, 255, 255, 0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --q1: #184f95; --q2: #1c5cab; --q3: #2a78d6; --q4: #5598e7; --q5: #9ec5f4;
  --critical-wash: rgba(208, 59, 59, 0.22);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--plane); color: var(--ink); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input { font: inherit; color: inherit; }
.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
       padding: 12px 16px; background: var(--plane); border-bottom: 1px solid var(--border); }
.top h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.live.off i { background: var(--warning); }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
aside { position: sticky; top: 72px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
        padding: 12px; max-height: calc(100vh - 88px); overflow: auto; }
aside h2, section > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.search { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--plane); }
.quick { display: flex; gap: 6px; margin: 8px 0; }
.quick button { flex: 1; border: 1px solid var(--border); background: none; border-radius: 6px; padding: 3px 6px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.cam-list { list-style: none; margin: 0; padding: 0; }
.cam-list label { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 4px;
                  border-radius: 6px; cursor: pointer; }
.cam-list label:hover { background: var(--wash); }
.cam-list .name { overflow-wrap: anywhere; }
.cam-list .sub { grid-column: 2 / 4; color: var(--muted); font-size: 12px; margin-top: -4px; }
.badge { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 7px; white-space: nowrap; }
.badge.yes { background: var(--critical-wash); color: var(--critical); }
.badge.ptz { background: var(--wash); color: var(--ink-2); }
.cam-list .group { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 10px 4px 2px; }
main { min-width: 0; display: grid; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
.tile .note { color: var(--muted); font-size: 12px; }
.panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
.panel > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.panel > header h3 { margin: 0; font-size: 16px; }
.panel > header .meta { color: var(--muted); font-size: 12px; }
.panel .body { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 14px; }
@media (max-width: 640px) { .panel .body { grid-template-columns: 1fr; } }
.snap { position: relative; aspect-ratio: 16 / 9; background: var(--wash); border-radius: 8px; overflow: hidden; }
.snap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.snap span { position: absolute; inset: auto 6px 6px auto; font-size: 11px; color: #fff; background: rgba(0, 0, 0, .5); border-radius: 4px; padding: 0 5px; }
.answers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; align-content: start; }
.answers li { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: start; }
.key { width: 14px; height: 2px; border-radius: 1px; margin-top: 9px; }
.answers .q { overflow-wrap: anywhere; }
.answers .q small { display: block; color: var(--muted); font-size: 11px; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; white-space: nowrap; background: var(--wash); color: var(--ink-2); }
.pill.yes { background: var(--critical-wash); color: var(--critical); }
.pill.yes::before { content: "▲ "; font-size: 9px; vertical-align: 1px; }
.stale { opacity: .55; }
.chart { position: relative; margin-top: 12px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.ref { stroke: var(--ink-2); stroke-width: 1; opacity: .55; }
.crosshair { stroke: var(--ink-2); stroke-width: 1; pointer-events: none; }
details { margin-top: 10px; color: var(--ink-2); font-size: 13px; }
summary { cursor: pointer; color: var(--muted); font-size: 12px; }
table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 12px; }
th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12px; margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.legend i.ring { background: none; border: 2px solid var(--muted); }
.multiples { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mini h4 { margin: 0; font-size: 13px; font-weight: 600; }
.hunter-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 14px; }
.hunter-head h4 { margin: 0 6px 0 0; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12px; color: var(--muted); }
.chips b { font-weight: 600; color: var(--ink-2); margin-left: 4px; }
.chips span { border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; color: var(--ink); background: var(--plane); }
.chips span.away { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--muted); }
.hunter-head .seg { margin-left: auto; }
.hsearch-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 6px; }
.hsearch-row input { flex: 1 1 240px; min-width: 0; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--plane); }
.hsearch-row button, .matches button { border: 1px solid var(--border); background: var(--plane); border-radius: 8px; padding: 5px 12px; cursor: pointer; color: var(--ink); }
.hsearch-row button[type=submit] { background: var(--ink); color: var(--plane); border-color: var(--ink); }
.matches { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.matches li { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.matches small { color: var(--muted); }
.mthumb { aspect-ratio: 4 / 3; border-radius: 6px; background-color: var(--wash); background-repeat: no-repeat; border: 1px solid var(--border); }
.mini .meta { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 24px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
       border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .14); max-width: 300px; display: none; }
#tip .t { color: var(--muted); margin-bottom: 4px; }
#tip .row { display: grid; grid-template-columns: 12px auto 1fr; gap: 6px; align-items: center; }
#tip .row b { font-variant-numeric: tabular-nums; }
#tip .row span:last-child { color: var(--ink-2); overflow-wrap: anywhere; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; max-height: none; }
}
</style>
</head>
<body>
<div class="top">
  <h1>Clef Operator</h1>
  <span class="live" id="live"><i></i><span id="updated">connecting…</span></span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Time range" id="range">
    <button data-h="1">1 h</button><button data-h="6">6 h</button><button data-h="24">24 h</button>
  </div>
</div>
<div class="layout">
  <aside aria-label="Cameras">
    <h2>Cameras</h2>
    <input class="search" id="search" type="search" placeholder="Find a camera" aria-label="Find a camera">
    <div class="quick"><button id="pick-active">With answers</button><button id="pick-all">All</button><button id="pick-none">None</button></div>
    <ul class="cam-list" id="cams"></ul>
  </aside>
  <main>
    <section class="tiles" id="tiles" aria-label="Summary"></section>
    <section><h2>Selected cameras</h2><div class="panels" id="panels"></div></section>
    <section><h2>Clef</h2><div class="panels" id="system"></div></section>
  </main>
</div>
<div id="tip" role="status"></div>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token");
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const CLASSES = ["critical", "high", "normal", "low"];
const NS = "http://www.w3.org/2000/svg";
const state = { hours: 6, selected: new Set(), cameras: [], dash: null, history: {}, maps: {}, system: null, search: "",
                hsearch: {},  // camera -> {q, result, busy, note}: someone's own search over its PTZ's embedding map
                hown: {},     // camera -> that map searched for what the hunter looks for (refreshed with the history)
                hview: {} };  // camera -> "like" (embedding map, the default) | "found" (what Clef's answers found)

// ---------- small helpers ----------
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const api = (path, params = {}) => {
  const q = new URLSearchParams(params);
  if (TOKEN) q.set("token", TOKEN);
  const s = q.toString();
  return "v1/" + path + (s ? "?" + s : "");
};
async function getJSON(path, params) {
  const r = await fetch(api(path, params), { cache: "no-store" });
  if (!r.ok) throw new Error(path + ": HTTP " + r.status);
  return r.json();
}
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined) e.append(c);
  return e;
}
function svg(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) e.setAttribute(k, v);
  return e;
}
const ago = s => s == null ? "–" : s < 60 ? Math.round(s) + " s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : (s / 3600).toFixed(1) + " h ago";
const pct = x => Math.round(x * 100) + "%";
const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const clockS = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const seriesColor = i => css(SERIES[i % SERIES.length]);
// Charts are drawn once their box is in the page, at its real width, so text stays its real size.
const drawers = new WeakMap();
function chartBox(draw, cls = "chart") { const box = el("div", { class: cls }); drawers.set(box, draw); return box; }
function drawCharts(root) {
  for (const box of root.querySelectorAll(".chart")) {
    const draw = drawers.get(box);
    if (!draw) continue;
    const W = Math.max(260, Math.round(box.clientWidth || 600));
    box.replaceChildren(...[].concat(draw(W)));
  }
}
// The x domain: the selected range, or from the first data if there is less history than that (at least 10 min).
function domain(times) {
  const now = Date.now() / 1000, start = now - state.hours * 3600;
  const first = times.length ? Math.min(...times) : now;
  return [Math.max(start, Math.min(first, now - 600)), now];
}

// ---------- tooltip ----------
const tip = document.getElementById("tip");
function showTip(evt, title, rows) {
  tip.replaceChildren(el("div", { class: "t", text: title }),
    ...rows.map(r => el("div", { class: "row" },
      el("i", { style: `display:block;width:12px;height:2px;border-radius:1px;background:${r.color || "transparent"}` }),
      el("b", { text: r.value }), el("span", { text: r.label || "" }))));
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + 14, y = evt.clientY + 14;
  if (x + w > innerWidth - 8) x = evt.clientX - w - 14;
  if (y + h > innerHeight - 8) y = evt.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

// ---------- selection (URL hash, then this browser's memory) ----------
function loadSelection() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("range")) state.hours = Number(h.get("range")) || 6;
  if (h.has("cams")) { state.selected = new Set(h.get("cams").split(",").filter(Boolean)); return true; }
  try {
    const saved = JSON.parse(localStorage.getItem("clef-dashboard") || "null");
    if (saved) { state.selected = new Set(saved.cams || []); state.hours = saved.hours || state.hours; return true; }
  } catch (e) { /* storage unavailable: fall back to the defaults */ }
  return false;
}
function saveSelection() {
  const h = new URLSearchParams({ cams: [...state.selected].join(","), range: String(state.hours) });
  history.replaceState(null, "", "#" + h.toString());
  try { localStorage.setItem("clef-dashboard", JSON.stringify({ cams: [...state.selected], hours: state.hours })); } catch (e) { /* ignore */ }
}

// ---------- camera list ----------
function renderCameraList() {
  const list = document.getElementById("cams");
  const q = state.search.toLowerCase();
  const shown = state.cameras.filter(c => !q || c.name.toLowerCase().includes(q));
  const active = shown.filter(c => c.has_answers || c.hunter), rest = shown.filter(c => !(c.has_answers || c.hunter));
  const item = c => {
    const box = el("input", { type: "checkbox", "aria-label": c.name });
    box.checked = state.selected.has(c.id);
    box.addEventListener("change", () => { box.checked ? state.selected.add(c.id) : state.selected.delete(c.id); saveSelection(); refreshAll(); });
    const badges = [];
    if (c.yes) badges.push(el("span", { class: "badge yes", text: "▲ " + c.yes + " yes" }));
    if (c.hunter) badges.push(el("span", { class: "badge ptz", text: "PTZ hunter" }));
    const sub = c.has_answers ? "answered " + ago(c.age_s) : (c.status || "no answers yet").toLowerCase();
    return el("li", {}, el("label", {}, box, el("span", { class: "name", text: c.name }), el("span", {}, badges),
      el("span", { class: "sub", text: sub })));
  };
  list.replaceChildren(
    ...(active.length ? [el("li", { class: "group", text: "With Clef answers" }), ...active.map(item)] : []),
    ...(rest.length ? [el("li", { class: "group", text: "Other cameras" }), ...rest.map(item)] : []));
}

// ---------- summary tiles ----------
function renderTiles() {
  const d = state.dash, sys = state.system;
  if (!d) return;
  const minutes = (sys && sys.minutes) || [];
  const answers = minutes.reduce((a, m) => a + m.answers, 0);
  const late = minutes.reduce((a, m) => a + m.late, 0);
  const busy = minutes.length ? minutes.reduce((a, m) => a + m.busy, 0) / minutes.length : 0;
  const yes = d.cameras.reduce((a, c) => a + c.questions.filter(q => q.yes && q.age_s < 120).length, 0);
  const tile = (label, value, note) => el("div", { class: "tile" }, el("div", { class: "label", text: label }),
    el("div", { class: "value", text: value }), el("div", { class: "note", text: note }));
  document.getElementById("tiles").replaceChildren(
    tile("Clef", d.clef && d.clef.status === "ready" ? "Ready" : (d.clef && d.clef.status) || "?", (d.clef && d.clef.precision) || ""),
    tile("Busy now", pct(d.busy_1m || 0), "average " + pct(busy) + (minutes.length && minutes.length < state.hours * 60 - 1 ? " since " + clock(minutes[0].t) : " over " + state.hours + " h")),
    tile("Answered", answers.toLocaleString(), "windows in the last " + state.hours + " h"),
    tile("On time", answers ? pct(1 - late / answers) : "–", late ? late + " late" : "none late"),
    tile("Saying yes now", String(yes), yes ? "questions above their threshold" : "nothing alerting"));
}

// ---------- camera panels ----------
function renderPanels() {
  const host = document.getElementById("panels");
  if (document.activeElement && document.activeElement.classList.contains("hsearch")) return; // typing a search
  const ids = [...state.selected];
  if (!ids.length) { host.replaceChildren(el("div", { class: "empty", text: "Pick cameras on the left to see their answers." })); return; }
  const byId = Object.fromEntries((state.dash ? state.dash.cameras : []).map(c => [c.id, c]));
  const names = Object.fromEntries(state.cameras.map(c => [c.id, c.name]));
  host.replaceChildren(...ids.map(id => panel(id, byId[id], names[id] || (byId[id] && byId[id].name) || id.slice(0, 8))));
  drawCharts(host);
}

function panel(id, cam, name) {
  const hist = state.history[id];
  const hunter = state.dash && state.dash.hunters ? state.dash.hunters[id] : null;
  const qIndex = {}; // color follows the question, in the camera's own fixed order
  (hist ? hist.questions : (cam ? cam.questions : [])).forEach((q, i) => { qIndex[q.id] = i; });
  const meta = [];
  if (cam) meta.push("answered " + ago(cam.age_s));
  if (cam && cam.latency) meta.push("mean " + cam.latency.mean + " s to answer", pct(cam.latency.on_time) + " on time");
  const img = el("img", { alt: "Latest frame from " + name, src: api("snapshot", { camera: id, t: Math.floor(Date.now() / 10000) }), loading: "lazy" });
  img.addEventListener("error", () => { img.replaceWith(el("span", { text: "no image" })); });
  const answers = el("ul", { class: "answers" }, cam ? cam.questions.map(q => {
    const value = q.kind === "noul" ? (q.yes ? "YES " : "no ") + q.p.toFixed(2)
      : (q.option ? (q.yes ? q.option.toUpperCase() : q.option) + " " + (q.option_p || 0).toFixed(2) : "–");
    return el("li", { class: q.age_s > 120 ? "stale" : "" },
      el("i", { class: "key", style: "background:" + seriesColor(qIndex[q.id] ?? 0) }),
      el("span", { class: "q" }, (q.zone ? q.zone + ": " : "") + q.text,
        el("small", { text: [q.priority, q.fps + " fps", q.latency_s != null ? q.latency_s + " s to answer" : null, ago(q.age_s)].filter(Boolean).join(" · ") })),
      el("span", { class: "pill" + (q.yes ? " yes" : ""), text: value }));
  }) : [el("li", { text: hunter ? "No video questions answered yet." : "No answers yet." })]);
  const article = el("article", { class: "panel", "aria-label": name },
    el("header", {}, el("h3", { text: name }), el("span", { class: "meta", text: meta.join(" · ") })),

  const since = now - t0 < state.hours * 3600 - 60 ? "since " + clock(t0) + " (no earlier history)" : "last " + state.hours + " h";
  host.replaceChildren(el("article", { class: "panel", style: "grid-column: 1 / -1" }, el("div", { class: "meta", text: since }), busy,
    minis.length ? el("div", { class: "multiples", style: "margin-top:14px" }, minis) : el("div", { class: "meta", text: "No answers in this range yet." })));
  drawCharts(host);
}

// ---------- refresh loops ----------
function markLive(ok) {
  document.getElementById("live").classList.toggle("off", !ok);
  document.getElementById("updated").textContent = ok ? "live · " + new Date().toLocaleTimeString() : "gateway unreachable, retrying";
}
async function refreshDashboard() {
  try { state.dash = await getJSON("dashboard"); markLive(true); renderTiles(); renderPanels(); } catch (e) { markLive(false); }
}
async function refreshCameras(first) {
  try {
    state.cameras = (await getJSON("cameras")).cameras;
    if (first && !state.selected.size) {
      state.cameras.filter(c => c.has_answers || c.hunter).forEach(c => state.selected.add(c.id));
      saveSelection();
    }
    renderCameraList();
  } catch (e) { markLive(false); }
}
async function refreshHistory() {
  const ids = [...state.selected];
  await Promise.all(ids.map(async id => {
    try { state.history[id] = await getJSON("history", { camera: id, hours: state.hours }); } catch (e) { /* keep the last render */ }
    if (state.cameras.find(c => c.id === id && c.hunter)) {
      try { state.maps[id] = await getJSON("hunter_map", { camera: id }); } catch (e) { /* ignore */ }
      try { state.hown[id] = await getJSON("hunter_search", { camera: id }); } catch (e) { /* the embedder may be down */ }
    }
  }));
  renderPanels();
}
async function refreshSystem() {
  try { state.system = await getJSON("system_history", { hours: state.hours }); renderSystem(); renderTiles(); } catch (e) { /* ignore */ }
}
function refreshAll() { renderCameraList(); refreshDashboard(); refreshHistory(); refreshSystem(); }

document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; renderCameraList(); });
document.getElementById("pick-active").addEventListener("click", () => {
  state.selected = new Set(state.cameras.filter(c => c.has_answers || c.hunter).map(c => c.id)); saveSelection(); refreshAll();
});
document.getElementById("pick-all").addEventListener("click", () => { state.selected = new Set(state.cameras.map(c => c.id)); saveSelection(); refreshAll(); });
document.getElementById("pick-none").addEventListener("click", () => { state.selected = new Set(); saveSelection(); refreshAll(); });
for (const b of document.querySelectorAll("#range button")) {
  b.addEventListener("click", () => { state.hours = Number(b.dataset.h); saveSelection(); markRange(); refreshHistory(); refreshSystem(); });
}
function markRange() { for (const b of document.querySelectorAll("#range button")) b.setAttribute("aria-pressed", String(Number(b.dataset.h) === state.hours)); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderPanels(); renderSystem(); });
let resizeTimer = 0;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { drawCharts(document.body); }, 200); });

loadSelection();
markRange();
refreshCameras(true).then(() => { refreshDashboard(); refreshHistory(); refreshSystem(); });
setInterval(refreshDashboard, 3000);
setInterval(refreshHistory, 15000);
setInterval(refreshSystem, 30000);
setInterval(() => refreshCameras(false), 60000);
</script>
